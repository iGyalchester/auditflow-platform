server:
  port: 8083

spring:
  application:
    name: alerting-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: alerting-service
  datasource:
    url: ${AURORA_JDBC_URL:jdbc:postgresql://localhost:5432/auditflow}
    username: ${AURORA_USERNAME:auditflow}
    password: ${AURORA_PASSWORD:auditflow}

audit:
  enrichment:
    topic: enriched-events

# Notifiers fall back to logging when unconfigured. For real email delivery
# also set spring.mail.host (e.g. SPRING_MAIL_HOST env var) - Spring Boot only
# creates the mail sender when that property is present.
alerting:
  slack:
    webhook-url: ${ALERT_SLACK_WEBHOOK_URL:}
  email:
    from: ${ALERT_EMAIL_FROM:alerts@auditflow.local}
    to: ${ALERT_EMAIL_TO:}
