spring:
  application:
    name: collector-agent
  main:
    web-application-type: none
  datasource:
    # The SOURCE database being watched (not AuditFlow's own storage).
    # Create a dedicated read-only account for the agent:
    #   CREATE USER 'auditflow_agent'@'%' IDENTIFIED BY '...';
    #   GRANT SELECT ON mysql.general_log TO 'auditflow_agent'@'%';
    # and enable the log on the source:
    #   SET GLOBAL log_output = 'TABLE'; SET GLOBAL general_log = 'ON';
    url: ${AGENT_DB_URL:jdbc:mysql://localhost:3306/mysql}
    username: ${AGENT_DB_USERNAME:root}
    password: ${AGENT_DB_PASSWORD:root}

agent:
  # Tenant the collected events belong to.
  customer-id: ${AGENT_CUSTOMER_ID:resistance}
  # Shows up as the event's resource, e.g. "resistance-mysql".
  resource-name: ${AGENT_RESOURCE_NAME:resistance-mysql}
  poll-ms: 15000
  batch-size: 500
  # Where the read position is written, so a restart resumes instead of
  # skipping everything logged while the agent was down. Blank disables
  # persistence and the cursor lives only in memory - fine for a throwaway
  # run, wrong for anything whose trail has to be complete.
  #
  # In a container this must be on a mounted volume: a checkpoint inside the
  # container filesystem dies with the container, which is exactly the
  # restart it exists to survive.
  checkpoint-file: ${AGENT_CHECKPOINT_FILE:./auditflow-agent.checkpoint}
  # How far back to start when there is no checkpoint yet. Zero means "start
  # at now", because on a first run the existing general log is history
  # nobody asked for and replaying it would flood ingestion. Set something
  # like PT1H on a first deploy if you do want the recent past. Ignored once
  # a checkpoint exists - re-applying it on every restart would re-read rows.
  startup-lookback: ${AGENT_STARTUP_LOOKBACK:PT0S}
  ingestion:
    url: ${AGENT_INGESTION_URL:http://localhost:8081}
    # The token half of one audit.ingestion.tokens entry on
    # ingestion-service. Its tenant half must equal agent.customer-id above,
    # or every event is rejected with 403.
    token: ${AGENT_INGESTION_TOKEN:}

logging:
  level:
    root: warn
    com.auditflow: info
