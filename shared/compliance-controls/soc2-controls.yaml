framework: SOC2
controls:
  - controlId: AC-2
    name: Account Management
    description: >
      Accounts and their activity are managed and monitored; queries and API
      calls made under an account constitute evidence of account activity.
    eventTypes: [DATABASE_QUERY, API_CALL, AUTH_EVENT]
  - controlId: IA-2
    name: Identification and Authentication
    description: >
      Users are uniquely identified and authenticated before access is
      granted.
    eventTypes: [AUTH_EVENT]
  - controlId: AU-2
    name: Audit Events
    description: >
      Access to sensitive resources and exports of data are captured as
      auditable events.
    eventTypes: [FILE_ACCESS, DATA_EXPORT]
  - controlId: AC-6
    name: Least Privilege
    description: >
      Permission changes are tracked to demonstrate privileges remain limited
      to what each role requires.
    eventTypes: [PERMISSION_CHANGE]
