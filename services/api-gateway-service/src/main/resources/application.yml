server:
  port: 8080

spring:
  application:
    name: api-gateway-service
  datasource:
    # Read side of the same Aurora the pipeline writes to. Every query is
    # scoped by the customer id the security layer established.
    url: ${AURORA_JDBC_URL:jdbc:postgresql://localhost:5432/auditflow}
    username: ${AURORA_USERNAME:auditflow}
    password: ${AURORA_PASSWORD:auditflow}
  sql:
    init:
      mode: always
      schema-locations: classpath:auditflow-schema.sql

# The internal ALB probes /actuator/health/liveness. Health is the only
# endpoint exposed, and it never shows component details: an unauthenticated
# probe inside the VPC should not be able to read our datasource URL.
#
# Why the ALB probes *liveness* and not the full /actuator/health: the full
# report includes the Aurora indicator, and the ALB check is also what ECS
# uses to decide a task is dead. Wire the database into it and an Aurora
# blip marks every gateway task unhealthy at once - the ALB drains all of
# them and ECS starts replacing them, turning a recoverable dependency
# outage into a total one with a cold-start stampede behind it. Liveness
# answers the question the load balancer is actually asking: can this
# process still serve a request? A hung or thread-starved gateway fails it,
# which is the defect this replaced ("/" answered 401 and counted as
# healthy). /actuator/health, database included, stays available inside the
# VPC for humans and alarms.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

audit:
  auth:
    # false = open, customer from the X-Customer-Id header. Local dev only;
    # the aws profile turns enforcement on and then the two Cognito values
    # below are required (startup fails without them).
    enabled: ${AUDIT_AUTH_ENABLED:false}
    # https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
    issuer-uri: ${COGNITO_ISSUER_URI:}
    # Defaults to <issuer-uri>/.well-known/jwks.json
    jwk-set-uri: ${COGNITO_JWK_SET_URI:}
    client-id: ${COGNITO_CLIENT_ID:}
  rate-limit:
    # Per client IP on /api/**: burst, then sustained rate. 429 + Retry-After.
    enabled: true
    requests-per-second: 20
    burst: 40
    max-tracked-clients: 10000
    # Header a trusted proxy sets to the real client address, overwriting
    # anything the caller sent. Empty = use the socket address. Never set
    # this to X-Forwarded-For: every hop appends to it, so its value is
    # partly chosen by the client and a caller could rotate it to escape
    # the limit or forge someone else's to get them limited.
    client-ip-header: ""
