services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: auditflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: auditflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auditflow
      POSTGRES_USER: auditflow
      POSTGRES_PASSWORD: auditflow
    volumes:
      - auditflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditflow -d auditflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7
    container_name: auditflow-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - auditflow-localstack-data:/var/lib/localstack
      # creates the auditflow-events bucket once LocalStack is ready
      - ./docker/localstack-init:/etc/localstack/init/ready.d:ro

  # ---------------------------------------------------------------------
  # Application services. Off by default so `docker compose up -d` still
  # gives you just the infrastructure for `mvn spring-boot:run`. To run
  # the whole platform in containers:
  #
  #   mvn -DskipTests clean package
  #   docker compose --profile app up --build -d
  #
  # Images come from the root Dockerfile (one per module, jar copied from
  # target/). Secrets and switches pass through from your shell: set
  # AUDIT_INGESTION_TOKEN to lock the intake, ALERT_SLACK_WEBHOOK_URL /
  # ALERT_EMAIL_* to make alerts real, AUDIT_AUTH_ENABLED=true plus the
  # COGNITO_* values to enforce JWTs on the gateway.
  # ---------------------------------------------------------------------
  ingestion-service:
    build:
      context: .
      args:
        MODULE: ingestion-service
    container_name: auditflow-ingestion
    profiles: [app]
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUDIT_INGESTION_TOKEN: ${AUDIT_INGESTION_TOKEN:-}
    depends_on:
      kafka:
        condition: service_healthy

  enrichment-service:
    build:
      context: .
      args:
        MODULE: enrichment-service
    container_name: auditflow-enrichment
    profiles: [app]
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AURORA_JDBC_URL: jdbc:postgresql://postgres:5432/auditflow
      AURORA_USERNAME: auditflow
      AURORA_PASSWORD: auditflow
      AUDIT_S3_BUCKET: auditflow-events
      AUDIT_S3_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  alerting-service:
    build:
      context: .
      args:
        MODULE: alerting-service
    container_name: auditflow-alerting
    profiles: [app]
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AURORA_JDBC_URL: jdbc:postgresql://postgres:5432/auditflow
      AURORA_USERNAME: auditflow
      AURORA_PASSWORD: auditflow
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      AWS_REGION: us-east-1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-gateway-service:
    build:
      context: .
      args:
        MODULE: api-gateway-service
    container_name: auditflow-gateway
    profiles: [app]
    ports:
      - "8080:8080"
    environment:
      AURORA_JDBC_URL: jdbc:postgresql://postgres:5432/auditflow
      AURORA_USERNAME: auditflow
      AURORA_PASSWORD: auditflow
      AUDIT_AUTH_ENABLED: ${AUDIT_AUTH_ENABLED:-false}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  reporting-service:
    build:
      context: .
      args:
        MODULE: reporting-service
    container_name: auditflow-reporting
    profiles: [app]
    ports:
      - "8084:8084"

volumes:
  auditflow-postgres-data:
  auditflow-localstack-data:
