name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runners provide Docker, so the Testcontainers integration tests run
      # here for real (the parent pom pins docker-java's api.version, which
      # keeps them from being silently skipped on Engine 29+).
      - name: Build and run all tests
        run: mvn -B clean install
