server:
  port: 8082

spring:
  application:
    name: enrichment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: enrichment-service
  datasource:
    url: ${AURORA_JDBC_URL:jdbc:postgresql://localhost:5432/auditflow}
    username: ${AURORA_USERNAME:auditflow}
    password: ${AURORA_PASSWORD:auditflow}
  sql:
    init:
      mode: always

audit:
  ingestion:
    topic: audit-events
  enrichment:
    # Enriched events are republished here for alerting-service. Declared
    # on startup with this retention (per-topic is how MSK Serverless
    # retention works); a week of replay headroom, not storage.
    enriched-topic: audit-events-enriched
    enriched-topic-partitions: 6
    enriched-topic-retention: 7d
    ack-timeout: 10s
    delivery-timeout: 10s
  storage:
    s3:
      bucket: ${AUDIT_S3_BUCKET:auditflow-events}
      endpoint: ${AUDIT_S3_ENDPOINT:http://localhost:4566}
      region: ${AWS_REGION:us-east-1}
