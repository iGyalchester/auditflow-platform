server:
  port: 8080

spring:
  application:
    name: api-gateway-service
  # Read-only access to the same Aurora/Postgres store that enrichment-service
  # writes queryable audit metadata into. The gateway does not own the schema
  # (enrichment's schema.sql does), so no spring.sql.init here.
  datasource:
    url: ${AURORA_JDBC_URL:jdbc:postgresql://localhost:5432/auditflow}
    username: ${AURORA_USERNAME:auditflow}
    password: ${AURORA_PASSWORD:auditflow}

gateway:
  reporting:
    base-url: ${REPORTING_BASE_URL:http://localhost:8084}
