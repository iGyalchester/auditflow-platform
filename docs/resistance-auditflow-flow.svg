<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Resistance services on the left write to MySQL and push audit events to AuditFlow ingestion on the right; a collector agent on the AuditFlow side pulls the MySQL query log and posts it to the same ingestion endpoint; ingestion publishes to Kafka, enrichment classifies events and writes evidence to S3 and Aurora, which the API gateway serves.">
<style>
  :root{--bg:#F6F7F5;--surface:#FFFFFF;--ink:#18211F;--muted:#5C6B68;--line:#CBD4D1;--res:#0E7C73;--af:#B4570A;--code:#EEF1EF}
  @media (prefers-color-scheme: dark){:root{--bg:#0D1117;--surface:#161B22;--ink:#E4ECE9;--muted:#93A5A1;--line:#30363D;--res:#3FCDBF;--af:#F0A050;--code:#1F262E}}
  svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;color:var(--ink)}
  .bg{fill:var(--bg)}
  .box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
  .res .box{stroke:var(--res)} .af .box{stroke:var(--af)}
  .ext .box{stroke:var(--line);stroke-dasharray:4 3}
  .store .box{fill:var(--code)}
  .t{fill:var(--ink);font-weight:500}
  .s{fill:var(--muted);font-size:10.5px;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  .lbl{fill:var(--muted);font-size:10.5px;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
  .region{fill:var(--muted);font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em}
  .edge{fill:none;stroke:var(--muted);stroke-width:1.3}
  .edge.res{stroke:var(--res);stroke-width:1.8}
  .edge.af{stroke:var(--af);stroke-width:1.8}
  .group{fill:none;stroke:var(--line);stroke-dasharray:3 3}
  .boundary{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
  .arrow{fill:var(--muted)} .arrow.res{fill:var(--res)} .arrow.af{fill:var(--af)}
</style>
<rect class="bg" x="0" y="0" width="1000" height="500"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker>
        <marker id="ares" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow res" d="M0 0L10 5L0 10z"/></marker>
        <marker id="aaf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow af" d="M0 0L10 5L0 10z"/></marker>
      </defs>

      <line class="boundary" x1="485" y1="12" x2="485" y2="490"/>
      <text class="region" x="30" y="22">RESISTANCE · tracker</text>
      <text class="region" x="540" y="22">AUDITFLOW · evidence</text>

      <!-- inputs -->
      <g class="ext"><rect class="box" x="45" y="40" width="160" height="40" rx="3"/><text class="t" x="125" y="64" text-anchor="middle">Forwarded email</text></g>
      <g class="ext"><rect class="box" x="250" y="40" width="160" height="40" rx="3"/><text class="t" x="330" y="64" text-anchor="middle">Browser · React SPA</text></g>

      <!-- resistance services group -->
      <rect class="group" x="30" y="110" width="400" height="100" rx="4"/>
      <text class="s" x="227" y="201" text-anchor="middle">shared AuditEventClient</text>
      <g class="res"><rect class="box" x="45" y="132" width="160" height="48" rx="3"/><text class="t" x="125" y="152" text-anchor="middle">intake-service</text><text class="s" x="125" y="168" text-anchor="middle">:8087 · parses the email</text></g>
      <g class="res"><rect class="box" x="250" y="132" width="160" height="48" rx="3"/><text class="t" x="330" y="152" text-anchor="middle">mvc-service</text><text class="s" x="330" y="168" text-anchor="middle">:8085 · OTP login, /api</text></g>

      <line class="edge" x1="125" y1="80" x2="125" y2="130" marker-end="url(#a)"/>
      <text class="lbl" x="132" y="104">SES → SNS, signature-verified</text>
      <line class="edge" x1="330" y1="80" x2="330" y2="130" marker-end="url(#a)"/>
      <text class="lbl" x="337" y="104">one-time code, session cookie</text>

      <!-- mysql -->
      <g class="res store"><rect class="box" x="160" y="270" width="160" height="50" rx="3"/><text class="t" x="240" y="290" text-anchor="middle">MySQL</text><text class="s" x="240" y="306" text-anchor="middle">rows + general_log</text></g>
      <polyline class="edge" points="125,180 125,245 200,245 200,268" marker-end="url(#a)"/>
      <polyline class="edge" points="330,180 330,245 280,245 280,268" marker-end="url(#a)"/>
      <text class="lbl" x="240" y="240" text-anchor="middle">owner-scoped writes</text>

      <!-- push -->
      <line class="edge res" x1="430" y1="155" x2="578" y2="155" marker-end="url(#ares)"/>
      <text class="lbl" x="504" y="143" text-anchor="middle">push · /api/v1/events</text>
      <text class="lbl" x="504" y="172" text-anchor="middle">async · never throws</text>

      <!-- pull -->
      <line class="edge af" x1="580" y1="295" x2="322" y2="295" marker-end="url(#aaf)"/>
      <text class="lbl" x="450" y="283" text-anchor="middle">pull · reads general_log</text>
      <text class="lbl" x="450" y="312" text-anchor="middle">read-only · literals redacted</text>

      <!-- auditflow -->
      <g class="af"><rect class="box" x="580" y="132" width="150" height="48" rx="3"/><text class="t" x="655" y="152" text-anchor="middle">ingestion-service</text><text class="s" x="655" y="168" text-anchor="middle">constant-time token</text></g>
      <g class="af"><rect class="box" x="580" y="270" width="150" height="50" rx="3"/><text class="t" x="655" y="290" text-anchor="middle">collector-agent</text><text class="s" x="655" y="306" text-anchor="middle">JDBC · checkpointed</text></g>
      <line class="edge af" x1="655" y1="270" x2="655" y2="182" marker-end="url(#aaf)"/>
      <text class="lbl" x="663" y="222">commit checkpoint</text>
      <text class="lbl" x="663" y="236">only after 202</text>

      <g class="af store"><rect class="box" x="800" y="132" width="170" height="48" rx="3"/><text class="t" x="885" y="152" text-anchor="middle">Kafka</text><text class="s" x="885" y="168" text-anchor="middle">topic audit-events</text></g>
      <line class="edge af" x1="730" y1="155" x2="798" y2="155" marker-end="url(#aaf)"/>
      <text class="lbl" x="764" y="145" text-anchor="middle">publish</text>

      <g class="af"><rect class="box" x="800" y="240" width="170" height="50" rx="3"/><text class="t" x="885" y="260" text-anchor="middle">enrichment-service</text><text class="s" x="885" y="276" text-anchor="middle">classify · detect · rules</text></g>
      <line class="edge af" x1="885" y1="180" x2="885" y2="238" marker-end="url(#aaf)"/>
      <text class="lbl" x="892" y="213">consume</text>

      <g class="af store"><rect class="box" x="800" y="340" width="80" height="50" rx="3"/><text class="t" x="840" y="360" text-anchor="middle">S3</text><text class="s" x="840" y="376" text-anchor="middle">Object Lock</text></g>
      <g class="af store"><rect class="box" x="890" y="340" width="80" height="50" rx="3"/><text class="t" x="930" y="360" text-anchor="middle">Aurora</text><text class="s" x="930" y="376" text-anchor="middle">query rows</text></g>
      <line class="edge af" x1="840" y1="290" x2="840" y2="338" marker-end="url(#aaf)"/>
      <line class="edge af" x1="930" y1="290" x2="930" y2="338" marker-end="url(#aaf)"/>

      <g class="af"><rect class="box" x="580" y="420" width="150" height="50" rx="3"/><text class="t" x="655" y="440" text-anchor="middle">api-gateway</text><text class="s" x="655" y="456" text-anchor="middle">reports · alerts · JWT</text></g>
      <polyline class="edge af" points="930,390 930,445 732,445" marker-end="url(#aaf)"/>
      <text class="lbl" x="831" y="438" text-anchor="middle">SOC 2 · GDPR · HIPAA reports</text>
    </svg>